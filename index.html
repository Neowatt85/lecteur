<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1618">
<title>Lecteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1618;
  --ink-2:#141E20;
  --surface:#182427;
  --line:#2A3A3D;
  --paper:#EDE7DB;
  --muted:#8B9EA0;
  --brass:#D9A441;
  --sage:#79B4A2;
  --alert:#C8785F;
  --rail-w:30px;
  --bar-h:76px;
  --f-ui:"Familjen Grotesk",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--paper);font-family:var(--f-ui);
  overflow:hidden;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}

/* ---------- top bar ---------- */
.top{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);background:var(--ink-2);
  flex:0 0 auto;
}
.top .name{
  flex:1;min-width:0;font-weight:600;font-size:15px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top .name small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.06em}
.chip{
  font-size:12px;font-weight:500;letter-spacing:.02em;padding:7px 11px;
  border:1px solid var(--line);border-radius:999px;color:var(--muted);
}
.chip:active{background:var(--surface)}

/* ---------- stage ---------- */
main{flex:1;position:relative;min-height:0;display:flex}
.rail{
  width:var(--rail-w);flex:0 0 auto;border-right:1px solid var(--line);
  background:var(--ink-2);display:flex;flex-direction:column;justify-content:center;
  gap:2px;padding:10px 0;touch-action:none;position:relative;
}
.tick{height:2px;border-radius:1px;background:#2E4145;margin-left:auto;margin-right:auto;width:9px;transition:background .15s,width .15s}
.tick.h{width:20px;background:#3E585C}
.tick.done{background:#4A6367}
.tick.h.done{background:#5B787C}
.tick.now{background:var(--brass);width:24px;height:3px;box-shadow:0 0 10px rgba(217,164,65,.55)}
.rail-grab{position:absolute;inset:0}

.stage{
  flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;
  padding:26vh 20px calc(28vh + var(--bar-h)) 22px;
  scroll-behavior:smooth;
}
.seg{
  font-family:var(--f-read);font-size:17px;line-height:1.62;color:#5D6E70;
  margin:0 0 20px;transition:color .3s;cursor:pointer;
}
.seg.h{
  font-family:var(--f-ui);font-weight:700;letter-spacing:-.02em;color:#6E8285;
  margin:34px 0 14px;line-height:1.25;
}
.seg.h.l1{font-size:23px}
.seg.h.l2{font-size:19px}
.seg.h.l3{font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.seg.now{color:var(--paper)}
.seg.h.now{color:var(--brass)}
.seg.now::before{
  content:"";position:absolute;left:0;width:3px;height:0;
}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:30px;text-align:center;color:var(--muted);
}
.empty h1{font-size:26px;color:var(--paper);margin:0;letter-spacing:-.02em}
.empty p{margin:0;font-size:14px;max-width:34ch;line-height:1.5}

/* ---------- transport ---------- */
.transport{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:4px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--ink-2);border-top:1px solid var(--line);
}
.tbtn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:6px 8px;border-radius:12px;color:var(--muted);min-width:52px;
}
.tbtn span{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.tbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbtn:active{background:var(--surface)}
.tbtn.play{
  background:var(--brass);color:#12191A;border-radius:999px;
  width:62px;height:62px;justify-content:center;gap:0;flex:0 0 auto;
}
.tbtn.play svg{width:27px;height:27px;stroke-width:2;fill:currentColor;stroke:none}
.tbtn.ask{color:var(--sage)}
.tbtn[disabled]{opacity:.32}

/* ---------- sheets ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(8,13,14,.62);backdrop-filter:blur(3px);
}
.sheet.on{display:block}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;display:flex;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 14px);
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.stage{scroll-behavior:auto}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.panel h2{
  margin:0;padding:0 18px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
.panel .scroll{overflow-y:auto;padding:0 18px}
.row{
  display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);
  text-align:left;width:100%;
}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:3px}
.row .del{color:var(--muted);padding:8px;font-size:12px}
.row.cur .t{color:var(--brass)}
.outline{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.outline.lv2{padding-left:16px;font-size:14px;color:#B9C6C7}
.outline.lv3{padding-left:32px;font-size:13px;color:var(--muted)}
.outline.cur{color:var(--brass)}
.outline .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-right:8px}

label.f{display:block;padding:14px 0;border-top:1px solid var(--line)}
label.f .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
label.f .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
input[type=text],input[type=password],select,textarea{
  width:100%;margin-top:8px;padding:11px 12px;background:var(--ink);color:var(--paper);
  border:1px solid var(--line);border-radius:10px;font-family:var(--f-mono);font-size:13px;
}
textarea{font-family:var(--f-ui);font-size:15px;resize:vertical}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--brass)}
.btn{
  display:block;width:100%;margin-top:16px;padding:14px;border-radius:12px;
  background:var(--brass);color:#12191A;font-weight:600;font-size:15px;text-align:center;
}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--paper)}
.btn.sage{background:var(--sage)}
.filebtn{
  display:block;padding:16px;border:1px dashed var(--line);border-radius:14px;text-align:center;
  color:var(--muted);font-size:14px;margin-top:8px;
}
input[type=file]{display:none}

/* ---------- ask ---------- */
.ask .panel{background:#12211E;border-top-color:#26403A}
.mic{
  width:74px;height:74px;border-radius:999px;background:var(--sage);color:#0F1D1A;
  display:flex;align-items:center;justify-content:center;margin:6px auto 14px;flex:0 0 auto;
}
.mic svg{width:30px;height:30px;fill:currentColor}
.mic.rec{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(121,180,162,.5)}50%{box-shadow:0 0 0 16px rgba(121,180,162,0)}}
.status{text-align:center;font-size:13px;color:var(--sage);letter-spacing:.02em;min-height:18px}
.qtext{font-size:15px;text-align:center;color:var(--paper);margin:12px 0 4px;line-height:1.4}
.answer{
  font-family:var(--f-read);font-size:16px;line-height:1.62;margin:14px 0 4px;
  padding:14px;background:rgba(121,180,162,.08);border-left:2px solid var(--sage);border-radius:0 10px 10px 0;
  white-space:pre-wrap;
}
.two{display:flex;gap:10px}
.two .btn{flex:1}
.err{color:var(--alert);font-size:13px;margin-top:10px;line-height:1.45}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 26px);
  background:var(--surface);border:1px solid var(--line);padding:10px 16px;border-radius:999px;
  font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<header class="top">
  <button class="chip" id="btnLib">Documents</button>
  <div class="name" id="docName">Aucun document<small id="docPos">—</small></div>
  <button class="chip" id="btnSet">Réglages</button>
</header>

<main>
  <div class="rail" id="rail"><div class="rail-grab" id="railGrab"></div></div>
  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <h1>Rien à lire pour l'instant</h1>
      <p>Ajoutez un PDF, un DOCX ou un fichier texte. Il est découpé en passages, avec un plan pour naviguer.</p>
      <button class="chip" id="btnFirst">Ajouter un document</button>
    </div>
  </div>
</main>

<nav class="transport">
  <button class="tbtn" id="btnPlan" disabled>
    <svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg><span>Plan</span>
  </button>
  <button class="tbtn" id="btnPrev" disabled>
    <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg><span>Précédent</span>
  </button>
  <button class="tbtn play" id="btnPlay" disabled aria-label="Lire">
    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="tbtn" id="btnNext" disabled>
    <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg><span>Suivant</span>
  </button>
  <button class="tbtn" id="btnRep" disabled>
    <svg viewBox="0 0 24 24"><path d="M3 11a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M21 13a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg><span>Répéter</span>
  </button>
  <button class="tbtn ask" id="btnAsk" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Demander</span>
  </button>
</nav>

<!-- Bibliothèque -->
<div class="sheet" id="shLib">
  <div class="panel">
    <div class="grip"></div>
    <h2>Documents</h2>
    <div class="scroll">
      <div id="libList"></div>
      <label class="filebtn">Ajouter un fichier (PDF, DOCX, TXT, MD)
        <input type="file" id="fileIn" accept=".pdf,.docx,.txt,.md,.markdown">
      </label>
      <div class="err" id="libErr"></div>
      <button class="btn ghost" data-close>Fermer</button>
    </div>
  </div>
</div>

<!-- Plan -->
<div class="sheet" id="shPlan">
  <div class="panel">
    <div class="grip"></div>
    <h2>Plan du document</h2>
    <div class="scroll" id="planList"></div>
  </div>
</div>

<!-- Réglages -->
<div class="sheet" id="shSet">
  <div class="panel">
    <div class="grip"></div>
    <h2>Réglages</h2>
    <div class="scroll">
      <label class="f">
        <span class="k">Voix</span>
        <select id="selVoice"></select>
        <span class="hint">Pour une voix nettement plus naturelle : Paramètres Android, Gestion générale, Synthèse vocale, puis installez « Google Text-to-Speech » et téléchargez la voix française de qualité supérieure.</span>
      </label>
      <label class="f">
        <span class="k">Vitesse <b id="rateVal" style="font-family:var(--f-mono);color:var(--brass)">1.0×</b></span>
        <input type="range" id="rate" min="0.6" max="1.6" step="0.05" value="1">
      </label>
      <label class="f">
        <span class="k">Clé API Anthropic</span>
        <input type="password" id="apiKey" placeholder="sk-ant-...">
        <span class="hint">Utilisée uniquement pour les questions posées à l'oral. Stockée sur ce téléphone, envoyée directement à l'API.</span>
      </label>
      <label class="f">
        <span class="k">Modèle</span>
        <input type="text" id="model" placeholder="claude-sonnet-5">
      </label>
      <button class="btn" id="saveSet">Enregistrer</button>
      <button class="btn ghost" data-close>Fermer</button>
    </div>
  </div>
</div>

<!-- Question -->
<div class="sheet ask" id="shAsk">
  <div class="panel">
    <div class="grip"></div>
    <h2>Question sur ce passage</h2>
    <div class="scroll">
      <button class="mic" id="mic" aria-label="Parler">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11z"/></svg>
      </button>
      <div class="status" id="askStatus">Touchez le micro et posez votre question</div>
      <div class="qtext" id="qText"></div>
      <textarea id="qInput" rows="2" placeholder="ou écrivez la question ici"></textarea>
      <div class="answer" id="answer" style="display:none"></div>
      <div class="err" id="askErr"></div>
      <button class="btn sage" id="sendQ">Envoyer la question</button>
      <div class="two">
        <button class="btn ghost" id="replay" style="display:none">Réécouter</button>
        <button class="btn ghost" id="resume">Reprendre la lecture</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
/* ============================================================
   Lecteur — lecture vocale de documents, usage personnel
   ============================================================ */
const $ = s => document.querySelector(s);
const synth = window.speechSynthesis;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- stockage ---------- */
function db(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('lecteur',1);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs',{keyPath:'id'});
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function tx(store,mode,fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(store,mode), s = t.objectStore(store);
    let out; try{ out = fn(s); }catch(e){ rej(e); return; }
    t.oncomplete = ()=>res(out && out.result !== undefined ? out.result : out);
    t.onerror = ()=>rej(t.error);
  });
}
const putDoc  = doc => tx('docs','readwrite', s=>s.put(doc));
const allDocs = ()  => tx('docs','readonly',  s=>s.getAll());
const getDoc  = id  => tx('docs','readonly',  s=>s.get(id));
const delDoc  = id  => tx('docs','readwrite', s=>s.delete(id));
const setKV   = (k,v)=> tx('kv','readwrite',  s=>s.put(v,k));
const getKV   = k   => tx('kv','readonly',    s=>s.get(k));

/* ---------- état ---------- */
const S = {
  doc:null, segs:[], idx:0, playing:false,
  chunks:[], ci:0, gen:0, mode:'idle',
  rate:1, voice:null, apiKey:'', model:'claude-sonnet-5',
  wl:null, lastAnswer:''
};

/* ---------- découpage des documents ---------- */
function cleanup(t){ return t.replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim(); }

function parseText(raw){
  const segs=[]; let buf=[];
  const flush=()=>{ const t=cleanup(buf.join(' ')); if(t) segs.push({type:'p',text:t}); buf=[]; };
  for(const line of raw.split(/\r?\n/)){
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){ flush(); segs.push({type:'h',level:Math.min(m[1].length,3),text:cleanup(m[2])}); continue; }
    if(!line.trim()){ flush(); continue; }
    buf.push(line.trim());
  }
  flush();
  return segs;
}

async function parseDocx(file){
  const arrayBuffer = await file.arrayBuffer();
  const {value:html} = await mammoth.convertToHtml({arrayBuffer});
  const doc = new DOMParser().parseFromString(html,'text/html');
  const segs=[];
  doc.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,td').forEach(el=>{
    const t = cleanup(el.textContent);
    if(!t) return;
    const h = el.tagName.match(/^H([1-6])$/);
    if(h) segs.push({type:'h',level:Math.min(+h[1],3),text:t});
    else  segs.push({type:'p',text:t});
  });
  return segs;
}

async function parsePdf(file){
  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    for(const it of tc.items){
      if(!it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      const h = Math.abs(it.transform[3]) || 10;
      let r = rows.get(y);
      if(!r){ r = {y,h:0,parts:[]}; rows.set(y,r); }
      r.h = Math.max(r.h,h);
      r.parts.push(it.str);
    }
    [...rows.values()].sort((a,b)=>b.y-a.y)
      .forEach(r=>lines.push({text:cleanup(r.parts.join(' ')), h:r.h, page:p}));
  }
  const body = lines.filter(l=>l.text && !/^\d{1,4}$/.test(l.text));
  if(!body.length) return [];

  // taille du corps de texte : la hauteur qui porte le plus de caractères,
  // et non la médiane, qui se laisse tirer vers le bas par les notes et les colonnes
  const weight = new Map();
  for(const l of body){
    const k = Math.round(l.h*2)/2;
    weight.set(k, (weight.get(k)||0) + l.text.length);
  }
  let base = 10, top = 0;
  for(const [k,w] of weight) if(w > top){ top = w; base = k; }

  // seuil ajusté : si trop de lignes passent pour des titres, c'est que le seuil est faux
  const looksTitle = (l,f)=> l.h > base*f && l.text.length < 110 && !/[.;,]$/.test(l.text);
  let factor = 1.18;
  for(const f of [1.18, 1.35, 1.6]){
    factor = f;
    if(body.filter(l=>looksTitle(l,f)).length / body.length < 0.22) break;
  }
  const usable = body.filter(l=>looksTitle(l,factor)).length / body.length < 0.22;

  const segs=[]; let buf='', lastPage = 0;
  const flush=()=>{ const t=cleanup(buf); if(t) segs.push({type:'p',text:t}); buf=''; };
  for(const l of body){
    if(!usable && l.page !== lastPage){        // pas de titres exploitables : repères par page
      flush(); segs.push({type:'h',level:2,text:'Page '+l.page});
      lastPage = l.page;
    }
    if(usable && looksTitle(l,factor)){
      flush(); segs.push({type:'h', level: l.h > base*factor*1.3 ? 1 : 2, text:l.text});
      continue;
    }
    buf = buf ? (buf.endsWith('-') ? buf.slice(0,-1)+l.text : buf+' '+l.text) : l.text;
    if(buf.length > 300 && /[.!?…»]$/.test(buf)) flush();
  }
  flush();
  return segs;
}

async function parseFile(file){
  const n = file.name.toLowerCase();
  if(n.endsWith('.pdf'))  return parsePdf(file);
  if(n.endsWith('.docx')) return parseDocx(file);
  return parseText(await file.text());
}

/* Beaucoup de documents s'ouvrent sur leur propre sommaire. On le repère
   en cherchant les passages du début dont le texte réapparaît plus loin
   comme titre, et on démarre la lecture juste après. */
function tocEnd(segs){
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                     .replace(/[^a-z0-9]/g,'').slice(0,45);
  const headPos = new Map();
  segs.forEach((s,i)=>{
    if(s.type!=='h') return;
    const k = norm(s.text);
    if(k.length > 6 && !headPos.has(k)) headPos.set(k,i);
  });
  const limit = Math.min(segs.length, Math.max(60, Math.floor(segs.length*0.25)));
  let last = -1, hits = 0;
  for(let i=0;i<limit;i++){
    const k = norm(segs[i].text);
    if(k.length > 6 && headPos.has(k) && headPos.get(k) > i+8){ hits++; last = i; }
  }
  return hits >= 8 ? last+1 : 0;
}

/* ---------- découpage pour la synthèse ---------- */
function chunkText(t){
  const MAX = 190, out = [];
  const sentences = t.match(/[^.!?…]+[.!?…]*\s*/g) || [t];
  let cur = '';
  for(let s of sentences){
    while(s.length > MAX*1.6){
      let cut = s.lastIndexOf(',', MAX);
      if(cut < 60) cut = s.lastIndexOf(' ', MAX);
      if(cut < 40) cut = MAX;
      if(cur){ out.push(cur.trim()); cur=''; }
      out.push(s.slice(0,cut+1).trim());
      s = s.slice(cut+1);
    }
    if((cur+s).length > MAX && cur){ out.push(cur.trim()); cur = s; }
    else cur += s;
  }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(Boolean);
}

/* ---------- moteur vocal ---------- */
function stopSpeech(){ S.gen++; try{ synth.cancel(); }catch(e){} }

function runChunks(list, startAt, onDone){
  const g = ++S.gen;
  let i = startAt;
  const step = ()=>{
    if(g !== S.gen) return;
    if(i >= list.length){ onDone && onDone(); return; }
    S.ci = i;
    const u = new SpeechSynthesisUtterance(list[i]);
    u.lang = 'fr-FR';
    u.rate = S.rate;
    if(S.voice) u.voice = S.voice;
    u.onend   = ()=>{ if(g!==S.gen) return; i++; step(); };
    u.onerror = e =>{ if(g!==S.gen || e.error==='interrupted' || e.error==='canceled') return; i++; step(); };
    synth.speak(u);
  };
  step();
}

async function wakeOn(){
  try{ if('wakeLock' in navigator && !S.wl) S.wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ S.wl && S.wl.release(); }catch(e){} S.wl = null; }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.playing) wakeOn(); });

function playFrom(chunkIndex){
  if(!S.segs.length) return;
  S.mode = 'doc';
  S.playing = true;
  S.chunks = chunkText(S.segs[S.idx].text);
  wakeOn();
  paint();
  runChunks(S.chunks, chunkIndex, ()=>{
    if(S.idx < S.segs.length-1){ S.idx++; save(); playFrom(0); }
    else pause(true);
  });
}
function play(){ playFrom(S.ci || 0); }
function pause(done){
  S.playing = false; stopSpeech(); wakeOff();
  if(done) S.ci = 0;
  paint();
}
function toggle(){ S.playing ? pause() : play(); }

function goto(i, autoplay){
  S.idx = Math.max(0, Math.min(S.segs.length-1, i));
  S.ci = 0; save();
  if(autoplay ?? S.playing) playFrom(0);
  else { stopSpeech(); render(); paint(); }
}
const next   = ()=>goto(S.idx+1);
const prev   = ()=>goto(S.idx-1);
const repeat = ()=>{ S.ci=0; if(S.playing) playFrom(0); else { paint(); playFrom(0); } };

/* garde-fou : si la synthèse s'arrête sans prévenir, on relance le passage courant */
let stalls = 0;
setInterval(()=>{
  if(S.mode==='doc' && S.playing && !synth.speaking && !synth.pending){
    if(++stalls >= 3){ stalls = 0; playFrom(S.ci); }
  } else stalls = 0;
}, 1200);

/* ---------- rendu ---------- */
const stage = $('#stage'), rail = $('#rail');
let winStart = 0, winEnd = 0;

function render(){
  if(!S.segs.length) return;
  winStart = Math.max(0, S.idx - 25);
  winEnd   = Math.min(S.segs.length, S.idx + 45);
  const frag = document.createDocumentFragment();
  for(let i=winStart; i<winEnd; i++){
    const s = S.segs[i];
    const el = document.createElement(s.type==='h' ? 'h3' : 'p');
    el.className = 'seg' + (s.type==='h' ? ' h l'+(s.level||1) : '');
    el.textContent = s.text;
    el.dataset.i = i;
    frag.appendChild(el);
  }
  stage.innerHTML = '';
  stage.appendChild(frag);
  paintStage(true);
  buildRail();
}

function paintStage(scroll){
  stage.querySelectorAll('.seg').forEach(el=>{
    const on = +el.dataset.i === S.idx;
    el.classList.toggle('now', on);
    if(on && scroll) requestAnimationFrame(()=>el.scrollIntoView({block:'center'}));
  });
}

let railMap = [];
function buildRail(){
  const n = S.segs.length;
  const count = Math.min(n, 110);
  railMap = [];
  rail.querySelectorAll('.tick').forEach(t=>t.remove());
  const frag = document.createDocumentFragment();
  for(let k=0;k<count;k++){
    const i = Math.round(k * (n-1) / Math.max(1,count-1));
    railMap.push(i);
    const t = document.createElement('div');
    t.className = 'tick' + (S.segs[i].type==='h' ? ' h' : '');
    frag.appendChild(t);
  }
  rail.appendChild(frag);
  paintRail();
}
function paintRail(){
  const ticks = rail.querySelectorAll('.tick');
  let best = 0, bd = Infinity;
  railMap.forEach((i,k)=>{ const d=Math.abs(i-S.idx); if(d<bd){bd=d;best=k;} });
  ticks.forEach((t,k)=>{
    t.classList.toggle('done', railMap[k] < S.idx);
    t.classList.toggle('now', k === best);
  });
}

function paint(){
  if(S.idx < winStart+3 || S.idx > winEnd-6) render();
  else paintStage(true);
  paintRail();
  $('#playIcon').innerHTML = S.playing
    ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $('#btnPlay').setAttribute('aria-label', S.playing ? 'Mettre en pause' : 'Lire');
  if(S.doc) $('#docPos').textContent =
    String(S.idx+1).padStart(3,'0') + ' / ' + S.segs.length + '  ·  ' +
    Math.round((S.idx+1)/S.segs.length*100) + '%';
}

/* ---------- documents ---------- */
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ if(S.doc){ S.doc.pos = S.idx; putDoc(S.doc); } }, 400);
}

async function open(id){
  const d = await getDoc(id);
  if(!d) return;
  pause(true);
  S.doc = d; S.segs = d.segs; S.idx = Math.min(d.pos||0, d.segs.length-1); S.ci = 0;
  $('#docName').firstChild.textContent = d.name;
  ['btnPlay','btnPrev','btnNext','btnRep','btnPlan','btnAsk'].forEach(b=>$('#'+b).disabled=false);
  setKV('last', id);
  render(); paint();
  closeSheets();
}

async function addFile(file){
  $('#libErr').textContent = '';
  toast('Analyse du document…');
  try{
    const segs = await parseFile(file);
    if(!segs.length) throw new Error('Aucun texte lisible trouvé. Si le PDF est un scan, il faut d\'abord le passer à l\'OCR.');
    const start = tocEnd(segs);
    const doc = {id:'d'+Date.now(), name:file.name.replace(/\.[^.]+$/,''), segs, pos:start, at:Date.now()};
    await putDoc(doc);
    await listDocs();
    await open(doc.id);
    toast(segs.length + ' passages' + (start ? ' · sommaire passé' : ''));
  }catch(e){
    $('#libErr').textContent = e.message || String(e);
    toast('Échec de l\'import');
  }
}

async function listDocs(){
  const docs = (await allDocs()).sort((a,b)=>b.at-a.at);
  const box = $('#libList');
  box.innerHTML = '';
  if(!docs.length){ box.innerHTML = '<div class="row"><div class="main"><div class="s">Aucun document enregistré</div></div></div>'; return; }
  docs.forEach(d=>{
    const row = document.createElement('div');
    row.className = 'row' + (S.doc && S.doc.id===d.id ? ' cur' : '');
    row.innerHTML = `<button class="main" style="text-align:left">
        <div class="t"></div>
        <div class="s">${d.segs.length} passages · ${Math.round(((d.pos||0)+1)/d.segs.length*100)}% lu</div>
      </button><button class="del">Supprimer</button>`;
    row.querySelector('.t').textContent = d.name;
    row.querySelector('.main').onclick = ()=>open(d.id);
    row.querySelector('.del').onclick = async ()=>{
      if(!confirm('Supprimer « '+d.name+' » ?')) return;
      await delDoc(d.id);
      if(S.doc && S.doc.id===d.id){
        pause(true); S.doc=null; S.segs=[]; stage.innerHTML='';
        $('#docName').firstChild.textContent = 'Aucun document';
        $('#docPos').textContent = '—';
        ['btnPlay','btnPrev','btnNext','btnRep','btnPlan','btnAsk'].forEach(b=>$('#'+b).disabled=true);
      }
      listDocs();
    };
    box.appendChild(row);
  });
}

/* ---------- plan ---------- */
function buildPlan(){
  const box = $('#planList');
  box.innerHTML = '';
  let entries = S.segs.map((s,i)=>({s,i})).filter(o=>o.s.type==='h');
  if(entries.length < 3){                              // pas de titres : repères réguliers
    entries = S.segs.map((s,i)=>({s,i})).filter(o=>o.i % 10 === 0)
      .map(o=>({s:{type:'h',level:2,text:o.s.text.slice(0,60)+'…'},i:o.i}));
  }
  entries.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'outline lv'+(o.s.level||1) + (o.i<=S.idx ? '' : '');
    if(o.i === S.idx) b.classList.add('cur');
    b.innerHTML = '<span class="n">'+String(o.i+1).padStart(3,'0')+'</span>';
    b.appendChild(document.createTextNode(o.s.text));
    b.onclick = ()=>{ closeSheets(); goto(o.i, S.playing); };
    box.appendChild(b);
  });
}

/* ---------- questions ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wasPlaying = false;

function openAsk(){
  wasPlaying = S.playing;
  pause();
  $('#qText').textContent = '';
  $('#qInput').value = '';
  $('#answer').style.display = 'none';
  $('#askErr').textContent = '';
  $('#replay').style.display = 'none';
  $('#askStatus').textContent = SR ? 'Touchez le micro et posez votre question'
                                   : 'Micro indisponible sur ce navigateur, écrivez la question';
  sheet('#shAsk', true);
  if(SR) setTimeout(startRec, 350);
}

function startRec(){
  if(!SR) return;
  try{ rec && rec.abort(); }catch(e){}
  rec = new SR();
  rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false;
  $('#mic').classList.add('rec');
  $('#askStatus').textContent = 'À l\'écoute…';
  rec.onresult = e=>{
    let t = '';
    for(const r of e.results) t += r[0].transcript;
    $('#qText').textContent = t;
    if(e.results[e.results.length-1].isFinal){ $('#qInput').value = t; ask(t); }
  };
  rec.onerror = e=>{
    $('#mic').classList.remove('rec');
    $('#askStatus').textContent = e.error==='not-allowed'
      ? 'Micro refusé. Autorisez-le dans le navigateur.'
      : 'Rien entendu, réessayez ou écrivez.';
  };
  rec.onend = ()=>$('#mic').classList.remove('rec');
  try{ rec.start(); }catch(e){}
}

async function ask(q){
  q = (q||'').trim();
  if(!q) return;
  if(!S.apiKey){ $('#askErr').textContent = 'Ajoutez votre clé API dans les réglages.'; return; }
  $('#askErr').textContent = '';
  $('#askStatus').textContent = 'Recherche de la réponse…';
  const from = Math.max(0, S.idx-3);
  const ctx = S.segs.slice(from, S.idx+2).map(s=>s.text).join('\n\n');
  try{
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':S.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: S.model,
        max_tokens: 700,
        system: "Tu assistes une personne qui écoute un document lu à voix haute. Elle t'interroge sur le passage en cours. Réponds en français, à l'oral, en 4 phrases maximum, sans liste ni titre, sans préambule. Appuie-toi sur le passage fourni ; si la réponse n'y est pas, dis-le et donne l'éclairage général utile.",
        messages:[{role:'user',content:`Document : ${S.doc.name}\n\nPassage en cours :\n"""${ctx}"""\n\nQuestion : ${q}`}]
      })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error.message || 'Erreur API');
    const txt = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
    S.lastAnswer = txt;
    $('#answer').textContent = txt;
    $('#answer').style.display = 'block';
    $('#replay').style.display = 'block';
    $('#askStatus').textContent = '';
    speakAnswer();
  }catch(e){
    $('#askStatus').textContent = '';
    $('#askErr').textContent = 'Réponse impossible : ' + (e.message||e);
  }
}

function speakAnswer(){
  S.mode = 'answer';
  runChunks(chunkText(S.lastAnswer), 0, ()=>{ S.mode='idle'; });
}

function resumeReading(){
  stopSpeech(); S.mode='idle';
  sheet('#shAsk', false);
  if(wasPlaying) playFrom(S.ci);
}

/* ---------- feuilles / UI ---------- */
function sheet(sel,on){ $(sel).classList.toggle('on', on); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on')); }
document.querySelectorAll('.sheet').forEach(sh=>{
  sh.addEventListener('click', e=>{ if(e.target===sh){ if(sh.id==='shAsk') resumeReading(); else closeSheets(); } });
});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* voix */
function loadVoices(){
  const vs = synth.getVoices().filter(v=>/^fr/i.test(v.lang));
  const sel = $('#selVoice');
  sel.innerHTML = '';
  (vs.length?vs:synth.getVoices()).forEach(v=>{
    const o = document.createElement('option');
    o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  });
  if(S.voice) sel.value = S.voice.voiceURI;
  else if(vs.length){ S.voice = vs[0]; sel.value = vs[0].voiceURI; }
}
synth.onvoiceschanged = loadVoices;

/* ---------- événements ---------- */
$('#btnPlay').onclick = toggle;
$('#btnNext').onclick = next;
$('#btnPrev').onclick = prev;
$('#btnRep').onclick  = repeat;
$('#btnPlan').onclick = ()=>{ buildPlan(); sheet('#shPlan',true); };
$('#btnAsk').onclick  = openAsk;
$('#btnLib').onclick  = ()=>{ listDocs(); sheet('#shLib',true); };
$('#btnFirst').onclick= ()=>{ listDocs(); sheet('#shLib',true); };
$('#btnSet').onclick  = ()=>{ loadVoices(); sheet('#shSet',true); };
$('#fileIn').onchange = e=>{ const f=e.target.files[0]; if(f) addFile(f); e.target.value=''; };
$('#mic').onclick     = startRec;
$('#sendQ').onclick   = ()=>ask($('#qInput').value);
$('#replay').onclick  = speakAnswer;
$('#resume').onclick  = resumeReading;

stage.addEventListener('click', e=>{
  const el = e.target.closest('.seg');
  if(el) goto(+el.dataset.i, S.playing);
});

/* rail : toucher ou glisser pour se déplacer dans le document */
let dragging = false;
function railSeek(ev){
  const r = rail.getBoundingClientRect();
  const y = Math.max(0, Math.min(1, (ev.clientY - r.top - 10) / (r.height - 20)));
  if(S.segs.length) goto(Math.round(y * (S.segs.length-1)), false);
}
$('#railGrab').addEventListener('pointerdown', e=>{ dragging=true; e.target.setPointerCapture(e.pointerId); railSeek(e); });
$('#railGrab').addEventListener('pointermove', e=>{ if(dragging) railSeek(e); });
$('#railGrab').addEventListener('pointerup',   ()=>{ dragging=false; });

$('#rate').oninput = e=>{
  S.rate = +e.target.value;
  $('#rateVal').textContent = S.rate.toFixed(2).replace(/0$/,'') + '×';
};
$('#selVoice').onchange = e=>{
  S.voice = synth.getVoices().find(v=>v.voiceURI===e.target.value) || null;
};
$('#saveSet').onclick = async ()=>{
  S.apiKey = $('#apiKey').value.trim();
  S.model  = $('#model').value.trim() || 'claude-sonnet-5';
  await setKV('cfg',{apiKey:S.apiKey, model:S.model, rate:S.rate, voice:S.voice?S.voice.voiceURI:''});
  closeSheets(); toast('Réglages enregistrés');
};

document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  if(e.code==='ArrowRight') next();
  if(e.code==='ArrowLeft')  prev();
  if(e.code==='KeyR')       repeat();
});

/* ---------- démarrage ---------- */
(async function init(){
  const cfg = await getKV('cfg') || {};
  S.apiKey = cfg.apiKey || ''; S.model = cfg.model || 'claude-sonnet-5';
  S.rate = cfg.rate || 1;
  $('#apiKey').value = S.apiKey; $('#model').value = S.model;
  $('#rate').value = S.rate; $('#rateVal').textContent = S.rate.toFixed(2).replace(/0$/,'')+'×';
  loadVoices();
  if(cfg.voice) setTimeout(()=>{ S.voice = synth.getVoices().find(v=>v.voiceURI===cfg.voice)||S.voice; loadVoices(); }, 600);
  await listDocs();
  const last = await getKV('last');
  if(last) { try{ await open(last); }catch(e){} }
  else $('#empty') && stage.appendChild($('#empty'));
})();
</script>
</body>
